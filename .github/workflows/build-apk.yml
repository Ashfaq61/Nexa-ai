name: Build and Publish Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "JAVA_HOME: $JAVA_HOME"
          java -version
          JAVA_VER_STR=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}')
          echo "Detected Java version string: $JAVA_VER_STR"
          if [ -z "$JAVA_VER_STR" ]; then
            echo "Error: Could not detect Java version."
            exit 1
          fi
          MAJOR_VER=$(echo "$JAVA_VER_STR" | cut -d'.' -f1)
          if [ "$MAJOR_VER" -eq 1 ]; then
            MAJOR_VER=$(echo "$JAVA_VER_STR" | cut -d'.' -f2)
          fi
          echo "Active Java major version: $MAJOR_VER"
          if [ "$MAJOR_VER" -lt 17 ]; then
            echo "Error: Active Java major version ($MAJOR_VER) is lower than 17."
            exit 1
          fi
          echo "Java 17+ environment verified successfully."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ -f "./debug.keystore" ]; then
            echo "debug.keystore already exists. Reusing existing file."
          else
            echo "Creating temporary debug keystore..."
            keytool -genkey -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi
          if [ ! -f "./debug.keystore" ]; then
            echo "Error: Failed to create ./debug.keystore"
            exit 1
          fi
          echo "Temporary debug keystore verified."

      - name: Build the debug APK
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify the APK
        run: |
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$EXPECTED_APK" ]; then
            echo "Error: Expected APK $EXPECTED_APK not found!"
            if [ -d "app/build/outputs/apk" ]; then
              echo "Discovered APK files inside app/build/outputs/apk:"
              find app/build/outputs/apk -maxdepth 3 -type f -name "*.apk"
            fi
            exit 1
          fi

          if [ ! -f "$EXPECTED_APK" ]; then
            echo "Error: $EXPECTED_APK is not a regular file."
            exit 1
          fi

          if [ ! -s "$EXPECTED_APK" ]; then
            echo "Error: $EXPECTED_APK is empty (0 bytes)."
            exit 1
          fi

          case "$EXPECTED_APK" in
            *.apk) ;;
            *) echo "Error: $EXPECTED_APK does not have .apk extension."; exit 1 ;;
          esac

          if [ "$EXPECTED_APK" != "app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "Error: APK path is not exactly app/build/outputs/apk/debug/app-debug.apk"
            exit 1
          fi

          echo "APK verification passed: $EXPECTED_APK (size: $(stat -c%s "$EXPECTED_APK") bytes)"

      - name: Upload debug APK artifact
        id: upload_artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          TEMP_DIR="${RUNNER_TEMP}/apk_release_asset"
          mkdir -p "$TEMP_DIR"
          REPO_RAW="${GITHUB_REPOSITORY#*/}"
          REPO_SAFE=$(echo "$REPO_RAW" | tr -c '[:alnum:]_.-' '-')
          REPO_SAFE=$(echo "$REPO_SAFE" | sed 's/^-//; s/-$//')
          if [ -z "$REPO_SAFE" ]; then
            REPO_SAFE="android-app"
          fi
          ASSET_FILENAME="${REPO_SAFE}-debug-build-${GITHUB_RUN_NUMBER}.apk"
          DEST_PATH="${TEMP_DIR}/${ASSET_FILENAME}"
          cp "app/build/outputs/apk/debug/app-debug.apk" "$DEST_PATH"

          if [ ! -f "$DEST_PATH" ] || [ ! -s "$DEST_PATH" ]; then
            echo "Error: Prepared release asset is missing or empty: $DEST_PATH"
            exit 1
          fi

          echo "asset_path=${DEST_PATH}" >> "$GITHUB_OUTPUT"
          echo "asset_name=${ASSET_FILENAME}" >> "$GITHUB_OUTPUT"
          echo "Prepared release asset: $DEST_PATH"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh --version
          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"

          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "Error: Asset file validation failed: $ASSET_PATH"
            exit 1
          fi

          case "$ASSET_PATH" in
            *.apk) ;;
            *) echo "Error: Asset file does not have .apk extension: $ASSET_PATH"; exit 1 ;;
          esac

          TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"

          NOTES=$(cat <<EOF
          ### Automated Debug APK Release

          - **Build System**: GitHub Actions
          - **Run Number**: ${GITHUB_RUN_NUMBER}
          - **Run Attempt**: ${GITHUB_RUN_ATTEMPT}
          - **Source Commit**: ${GITHUB_SHA}
          - **Asset Name**: ${ASSET_NAME}
          - **Intended Purpose**: Testing and device verification
          - **Signing**: Signed with temporary debug keystore (not for Play Store production)
          EOF
          )

          echo "Creating GitHub Release with tag: $TAG"
          gh release create "$TAG" "$ASSET_PATH" \
            --title "$TITLE" \
            --notes "$NOTES" \
            --target "$GITHUB_SHA" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"

          if [ "${{ steps.publish_release.outcome }}" = "success" ]; then
            echo "GitHub Release published successfully."
            gh release view "$TAG"
            RELEASE_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
            echo "Release Tag: $TAG"
            echo "Release Title: $TITLE"
            echo "Release Page URL: $RELEASE_URL"
            echo "Release Asset Filename: $ASSET_NAME"

            echo "### 🚀 Debug APK Build & Release Summary" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "✅ **Debug APK built successfully**" >> $GITHUB_STEP_SUMMARY
            echo "✅ **GitHub Actions artifact uploaded**: \`app-debug-apk\`" >> $GITHUB_STEP_SUMMARY
            echo "✅ **GitHub Release published**: [$TITLE]($RELEASE_URL)" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "📲 **Download for Phone**: You can download \`${ASSET_NAME}\` directly from the [GitHub Release page]($RELEASE_URL) under the **Assets** section." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "📦 **Backup Artifact**: The standard Actions artifact \`app-debug-apk\` remains available on this workflow run page." >> $GITHUB_STEP_SUMMARY
          else
            echo "WARNING: GitHub Release creation failed or was skipped."
            echo "APK build and artifact upload completed successfully."
            echo "The debug APK artifact 'app-debug-apk' remains available for download."

            echo "### ⚠️ Debug APK Build Summary" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "✅ **Debug APK built successfully**" >> $GITHUB_STEP_SUMMARY
            echo "✅ **GitHub Actions artifact uploaded**: \`app-debug-apk\`" >> $GITHUB_STEP_SUMMARY
            echo "⚠️ **GitHub Release publishing encountered an issue or was skipped.**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "📦 **Download Instructions**: The debug APK is preserved as a standard GitHub Actions artifact named \`app-debug-apk\`. You can download it directly from this workflow run summary." >> $GITHUB_STEP_SUMMARY
          fi
