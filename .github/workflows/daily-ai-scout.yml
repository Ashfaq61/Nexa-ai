name: Daily AI Tool Scout

on:
  schedule:
    - cron: '0 6 * * *' # Daily at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scout:
    name: Scout GitHub & Hugging Face
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ensure reports directory exists
        run: mkdir -p reports

      - name: Fetch GitHub Trending AI Agents
        run: |
          echo "Fetching trending AI agents from GitHub..."
          curl -s -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/search/repositories?q=ai+agent+stars:>50&sort=stars&order=desc&per_page=10" \
            -o reports/github_ai_agents.json

      - name: Fetch GitHub Self-Improving AI Repositories
        run: |
          echo "Fetching self-improving AI repos from GitHub..."
          curl -s -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/search/repositories?q=self+improving+agent+stars:>20&sort=stars&order=desc&per_page=10" \
            -o reports/github_self_improving.json

      - name: Fetch Hugging Face Top Models
        run: |
          echo "Fetching top models from Hugging Face..."
          curl -s "https://huggingface.co/api/models?sort=downloads&direction=-1&limit=10" \
            -o reports/huggingface_top_models.json

      - name: Fetch Hugging Face Top Spaces
        run: |
          echo "Fetching top spaces from Hugging Face..."
          curl -s "https://huggingface.co/api/spaces?sort=likes&direction=-1&limit=10" \
            -o reports/huggingface_top_spaces.json

      - name: Generate Daily Markdown Summary
        run: |
          TODAY=$(date -u +"%Y-%m-%d")
          SUMMARY_FILE="reports/daily_report_${TODAY}.md"
          echo "# Project Nexus - Daily AI Intelligence Report ($TODAY)" > $SUMMARY_FILE
          echo "" >> $SUMMARY_FILE
          echo "Generated automatically by Nexus Scout Agent." >> $SUMMARY_FILE
          echo "" >> $SUMMARY_FILE
          echo "## Top GitHub AI Agents" >> $SUMMARY_FILE
          if command -v jq >/dev/null 2>&1; then
            jq -r '.items[]? | "- [\(.full_name)](\(.html_url)) ⭐ \(.stargazers_count): \(.description // "No description")"' reports/github_ai_agents.json | head -n 8 >> $SUMMARY_FILE || echo "No items found" >> $SUMMARY_FILE
          else
            echo "Raw output saved to reports/github_ai_agents.json" >> $SUMMARY_FILE
          fi
          echo "" >> $SUMMARY_FILE
          echo "## Top Hugging Face Models" >> $SUMMARY_FILE
          if command -v jq >/dev/null 2>&1; then
            jq -r '.[]? | "- [\(.id)](https://huggingface.co/\(.id)) (Downloads: \(.downloads // 0))"' reports/huggingface_top_models.json | head -n 8 >> $SUMMARY_FILE || echo "No items found" >> $SUMMARY_FILE
          else
            echo "Raw output saved to reports/huggingface_top_models.json" >> $SUMMARY_FILE
          fi
          echo "" >> $SUMMARY_FILE
          echo "## Upgrade & Integration Proposals" >> $SUMMARY_FILE
          echo "- Evaluate newest autonomous frameworks (LangGraph, SmolAgents, AutoGen, Reflexio)" >> $SUMMARY_FILE
          echo "- Review safety guardrails before recommending user installation" >> $SUMMARY_FILE
          echo "- Safe self-improvement rule: Human approval strictly required before modifying codebase" >> $SUMMARY_FILE

      - name: Commit and push if reports changed
        run: |
          git config user.name "nexus-scout-bot"
          git config user.email "bot@nexus.ai"
          git add reports/
          if git diff --staged --quiet; then
            echo "No new changes to commit"
          else
            git commit -m "Automated Daily AI Intelligence Report [$(date -u +'%Y-%m-%d')]"
            git push origin main
          fi
